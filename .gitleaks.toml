# gitleaks: default rules plus allowlist for known non-secrets.
[extend]
useDefault = true

[allowlist]
description = "Generated code, lockfiles, third-party docs and known fake test values"
# Fake credential used to test the instruction secret scanner (app/src/controls/controls.test.ts).
regexes = ['''AbCdEf123456789''']
paths = [
  '''app/src/schema/validators\.generated\.js''',
  '''app/package-lock\.json''',
  '''(^|/)\.venv/''',
  '''research_notes/''',
]
