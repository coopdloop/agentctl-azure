# Deploys a released, attested build with OIDC (no secrets) using scripts/deploy.sh, which
# verifies SHA256SUMS and the build-provenance attestation before deploying.
# GitHub environments agentctl-dev / agentctl-prod hold AZURE_CLIENT_ID, AZURE_RESOURCE_GROUP,
# AZURE_APP_NAME and AGENTCTL_HOSTING (swa | appservice); prod requires reviewers, tags only.
name: deploy

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to deploy (e.g. v0.3.0)
        required: true
      environment:
        description: Target environment
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: agentctl-${{ inputs.environment || 'dev' }}
    concurrency:
      group: deploy-agentctl-${{ inputs.environment || 'dev' }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      attestations: read
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - name: Validate tag
        run: '[[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::invalid tag"; exit 1; }'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy (verifies checksum + provenance)
        env:
          GH_TOKEN: ${{ github.token }}
          AGENTCTL_REPO: ${{ github.repository }}
        run: |
          scripts/deploy.sh --target "${{ vars.AGENTCTL_HOSTING || 'swa' }}" --version "$TAG" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --name "${{ vars.AZURE_APP_NAME }}"
