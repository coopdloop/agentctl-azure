# Deploys a released, attested build to App Service with OIDC (no secrets). GitHub environments
# agentctl-dev / agentctl-prod hold AZURE_CLIENT_ID and AZURE_WEBAPP_NAME; prod requires reviewers
# and is restricted to tags. The artifact's provenance is verified before deploy.
name: deploy

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to deploy (e.g. v0.3.0)
        required: true
      environment:
        description: Target environment
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: agentctl-${{ inputs.environment || 'dev' }}
    concurrency:
      group: deploy-agentctl-${{ inputs.environment || 'dev' }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      attestations: read
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - name: Download release artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::invalid tag"; exit 1; }
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern agentctl-app.zip --pattern SHA256SUMS
          grep agentctl-app.zip SHA256SUMS | sha256sum -c -
      - name: Verify build provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation verify agentctl-app.zip --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy
        run: |
          rg=$(az webapp list --query "[?name=='${{ vars.AZURE_WEBAPP_NAME }}'].resourceGroup | [0]" -o tsv)
          az webapp deploy --resource-group "$rg" --name "${{ vars.AZURE_WEBAPP_NAME }}" --src-path agentctl-app.zip --type zip --async false
      - name: Smoke test
        run: |
          host=$(az webapp show --name "${{ vars.AZURE_WEBAPP_NAME }}" --resource-group "$(az webapp list --query "[?name=='${{ vars.AZURE_WEBAPP_NAME }}'].resourceGroup | [0]" -o tsv)" --query defaultHostName -o tsv)
          for i in 1 2 3 4 5 6; do curl -fsS "https://$host/healthz" && break; sleep 10; done
          curl -fsSI "https://$host/" | grep -i "content-security-policy"
