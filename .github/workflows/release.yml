# Tagged release: build once, attest provenance (SLSA build L2 via GitHub attestations), attach
# the app package, the verifier CLI and the SBOM. Deploys consume these exact artifacts.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release
      id-token: write      # sign attestations
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Build
        working-directory: app
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high
          npm test
          npm run package
          npm run build:cli
      - name: agents-gitops template
        run: |
          scripts/init-gitops-repo.sh --no-git artifacts/agents-gitops
          (cd artifacts && zip -qr agents-gitops-template.zip agents-gitops)
      - name: SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: app
          format: cyclonedx-json
          output-file: artifacts/agentctl-sbom.cdx.json
          upload-artifact: false
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            artifacts/agentctl-app.zip
            artifacts/agentctl-swa.zip
            artifacts/agentctl-verify.mjs
            artifacts/agents-gitops-template.zip
      - name: Attest SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: artifacts/agentctl-app.zip
          sbom-path: artifacts/agentctl-sbom.cdx.json
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          (cd artifacts && sha256sum agentctl-app.zip agentctl-swa.zip agentctl-verify.mjs agents-gitops-template.zip agentctl-sbom.cdx.json > SHA256SUMS)
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag \
            artifacts/agentctl-app.zip artifacts/agentctl-swa.zip artifacts/agentctl-verify.mjs artifacts/agentctl-verify.mjs.sha256 \
            artifacts/agents-gitops-template.zip \
            artifacts/agentctl-sbom.cdx.json artifacts/SHA256SUMS
