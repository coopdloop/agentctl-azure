name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "**Security issues:** use private vulnerability reporting, not issues. Remove tenant/subscription ids and tokens from logs."
  - type: input
    id: version
    attributes: { label: Version, placeholder: v0.1.0 }
    validations: { required: true }
  - type: dropdown
    id: hosting
    attributes: { label: Hosting, options: [Static Web Apps, App Service, Local] }
  - type: textarea
    id: what
    attributes: { label: What happened, description: Steps, expected vs actual, error text (redacted). }
    validations: { required: true }
